[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-cli"
version = "0.1.0"
description = "A Hyperliquid smart order trading system CLI"
authors = [
    {name = "tigerding", email = "zhiyuanding01@gmail.com"}
]
readme = "README.md"
license = {text = "AGPLv3"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "hyperliquid-python-sdk>=0.20.0",
    "eth-account>=0.13.0",
    "prompt_toolkit>=3.0.52",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.11.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
hyperliquid-cli = "cli:main"
hyperliquid-backend = "backend:main"

[project.urls]
Homepage = "https://github.com/zydtiger/hyperliquid-cli"
Repository = "https://github.com/zydtiger/hyperliquid-cli"
Issues = "https://github.com/zydtiger/hyperliquid-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes (standard logic errors)
    "I",    # isort (Import sorting)
    "N",    # pep8-naming (Naming conventions)
    "S",    # flake8-bandit (Security)
    "RET",  # flake8-return (Return statement logic)
    "B",    # flake8-bugbear (Common bugs/design flaws)
    "UP",   # pyupgrade (Modernize syntax for your Python version)
    "A",    # flake8-builtins (Shadowing built-ins)
    "C4",   # flake8-comprehensions (Better list/set/dict usage)
    "PL",   # Pylint (Modern implementation of Pylint rules)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "PLR0913", # Allow more than 5 arguments in a function if needed
]

[tool.ruff.lint.per-file-ignores]
# S101: allow asserts
# PLR2004: allow magic values (e.g., status codes like 200)
"scripts/*.py" = ["ALL"]
"tests/**/*.py" = ["S101", "PLR2004"]
"test_*.py" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "hyperliquid.*",
    "eth_account.*",
]
ignore_missing_imports = true
