name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv and Python
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --dev --locked

    # Lint, format, type and lockfile checks do not depend on the interpreter
    # in use (mypy targets a fixed python_version), so they run once here
    # rather than once per matrix leg.
    - name: Run commit hooks
      uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
      with:
        prek-version: "0.4.x"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv and Python
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-suffix: py${{ matrix.python-version }}
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev --locked

    - name: Run push-stage hooks
      uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
      with:
        prek-version: "0.4.x"
        extra-args: --all-files --hook-stage pre-push

    # The wheel does not vary by interpreter, so build and smoke-test it on the
    # lowest supported version only.
    - name: Build distributions
      if: matrix.python-version == '3.11'
      run: uv build

    - name: Install smoke test
      if: matrix.python-version == '3.11'
      run: |
        uv venv "$RUNNER_TEMP/smoke"
        uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
        "$RUNNER_TEMP/smoke/bin/hyperliquid-cli" --help
