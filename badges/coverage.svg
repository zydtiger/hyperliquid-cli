<svg xmlns="http://www.w3.org/2000/svg" width="98" height="20" role="img" aria-label="coverage: 40%">
  <title>coverage: 40%</title>
  <defs>
    <clipPath id="r">
      <rect width="98" height="20" rx="3" ry="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="20" fill="#555"/>
    <rect x="64" width="34" height="20" fill="#e05d44"/>
  </g>

  <!-- Text group with faux shadow like shields.io -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <!-- Left label shadow -->
    <text x="32.0" y="14" fill="#010101" fill-opacity=".3">coverage</text>
    <text x="32.0" y="13" fill="#fff">coverage</text>

    <!-- Right value shadow -->
    <text x="81.0" y="14" fill="#010101" fill-opacity=".3">40%</text>
    <text x="81.0" y="13" fill="#fff">40%</text>
  </g>
</svg>